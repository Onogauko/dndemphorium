<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Panel - Expired Control D&D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --magenta: #c026d3;
  --magenta-light: #fae8ff;
  --magenta-mid: #d946ef;
  --red: #dc2626;
  --red-light: #fee2e2;
  --green: #059669;
  --surface: #ffffff;
  --bg: #fdf4ff;
  --border: #f0e0f7;
  --text: #1c1033;
  --text-2: #6b7280;
  --text-3: #c084fc;
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); max-width: 430px; margin: 0 auto; min-height: 100vh; }

.header { background: var(--magenta); padding: 50px 20px 20px; }
.header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.header-title { color: #fff; font-size: 20px; font-weight: 600; }
.header-sub { color: rgba(255,255,255,0.55); font-size: 12px; margin-top: 2px; }
.back-btn { background: rgba(255,255,255,0.15); border: none; color: white; border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.back-btn:disabled { opacity: 0.5; }
.back-btn:hover { background: rgba(255,255,255,0.25); }

.main { padding: 16px; }
.inp { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 13px; font-size: 13px; margin-bottom: 8px; outline: none; font-family: 'DM Sans', sans-serif; }
.inp:focus { border-color: var(--magenta-mid); }

.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-box { background: white; border-radius: 12px; padding: 12px; text-align: center; border: 1px solid var(--border); }
.stat-number { font-size: 28px; font-weight: 700; color: var(--magenta); }
.stat-label { font-size: 11px; color: var(--text-2); }

.search-box { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px; font-size: 14px; margin-bottom: 16px; outline: none; font-family: 'DM Sans', sans-serif; }
.search-box:focus { border-color: var(--magenta-mid); }

.data-item { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; transition: all 0.2s; }
.data-item:hover { border-color: var(--magenta-mid); }
.data-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.data-barcode { font-size: 11px; color: var(--text-2); margin-bottom: 6px; font-family: 'DM Mono', monospace; }
.data-detail { font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.data-actions { display: flex; gap: 8px; }
.btn-edit { flex: 1; background: var(--magenta-light); border: none; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 600; color: var(--magenta); cursor: pointer; font-family: 'DM Sans', sans-serif; }
.btn-edit:active { background: var(--magenta-mid); color: white; }
.btn-delete { flex: 1; background: var(--red-light); border: none; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 600; color: var(--red); cursor: pointer; font-family: 'DM Sans', sans-serif; }
.btn-delete:active { background: var(--red); color: white; }
.btn-add { background: var(--magenta); color: white; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; margin-bottom: 16px; font-family: 'DM Sans', sans-serif; }
.btn-add:active { background: var(--magenta-mid); }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal-card { background: white; width: 100%; max-width: 430px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-weight: 700; font-size: 18px; margin-bottom: 20px; color: var(--magenta); }
.modal-field { margin-bottom: 16px; }
.modal-field label { font-size: 12px; font-weight: 600; color: var(--text-2); display: block; margin-bottom: 6px; }
.modal-field input { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; outline: none; font-family: 'DM Sans', sans-serif; }
.modal-field input:focus { border-color: var(--magenta-mid); }
.modal-actions { display: flex; gap: 12px; margin-top: 24px; }
.btn-cancel { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.btn-save { flex: 1; background: var(--magenta); border: none; border-radius: 10px; padding: 12px; font-weight: 600; color: white; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.btn-save:disabled, .btn-cancel:disabled { opacity: 0.55; }
.btn-save:active { background: var(--magenta-mid); }

.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tab-btn { flex: 1; background: white; border: 1.5px solid var(--border); border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text-2); font-family: 'DM Sans', sans-serif; }
.tab-btn.active { background: var(--magenta); color: white; border-color: var(--magenta); }

.pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.page-btn { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.page-btn.active { background: var(--magenta); color: white; border-color: var(--magenta); }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text-2); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1c1033; color: white; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 1000; transition: transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1); }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: #065f46; }
.toast.error { background: #7f1d1d; }

.sku-tag {
  display: inline-block;
  background: var(--magenta-light);
  color: var(--magenta);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  margin-right: 6px;
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOGIN MODAL -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-card">
    <div class="modal-title">🔐 Login Admin Panel</div>
    <div class="modal-field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Masukkan password admin" onkeypress="if(event.key==='Enter') doLogin()">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="window.location.href='index.html'">← Kembali</button>
      <button class="btn-save" onclick="doLogin()">Login</button>
    </div>
  </div>
</div>

<!-- EDIT INPUT MODAL -->
<div class="modal-overlay" id="modalEditInput">
  <div class="modal-card">
    <div class="modal-title">✏️ Edit Data Input</div>
    <div class="modal-field">
      <label>Barcode</label>
      <input type="text" id="editInputBarcode" readonly style="background:#f0f0f0;">
    </div>
    <div class="modal-field">
      <label>SKU</label>
      <input type="text" id="editInputSKU" readonly style="background:#f0f0f0;">
    </div>
    <div class="modal-field">
      <label>Nama Barang</label>
      <input type="text" id="editInputDesc">
    </div>
    <div class="modal-field">
      <label>Tanggal Expired</label>
      <input type="date" id="editInputExp">
    </div>
    <div class="modal-field">
      <label>Lokasi</label>
      <input type="text" id="editInputLokasi">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalEditInput')">Batal</button>
      <button class="btn-save" onclick="saveEditInput(this)">Simpan</button>
    </div>
  </div>
</div>

<!-- EDIT DATABASE MODAL -->
<div class="modal-overlay" id="modalEditDatabase">
  <div class="modal-card">
    <div class="modal-title">✏️ Edit Database</div>
    <input type="hidden" id="editDbOldBarcode">
    <div class="modal-field">
      <label>SKU</label>
      <input type="text" id="editDbSKU">
    </div>
    <div class="modal-field">
      <label>Barcode</label>
      <input type="text" id="editDbBarcode">
    </div>
    <div class="modal-field">
      <label>Nama Barang</label>
      <input type="text" id="editDbDesc">
    </div>
    <div class="modal-field">
      <label>Ketentuan Tarik (H-)</label>
      <input type="number" id="editDbTarik" min="0" placeholder="Contoh: 7 untuk H-7">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalEditDatabase')">Batal</button>
      <button class="btn-save" onclick="saveEditDatabase(this)">Simpan</button>
    </div>
  </div>
</div>

<!-- ADD DATABASE MODAL -->
<div class="modal-overlay" id="modalAddDatabase">
  <div class="modal-card">
    <div class="modal-title">➕ Tambah Database Baru</div>
    <div class="modal-field">
      <label>SKU</label>
      <input type="text" id="addDbSKU" placeholder="Masukkan SKU">
    </div>
    <div class="modal-field">
      <label>Barcode</label>
      <input type="text" id="addDbBarcode" placeholder="Masukkan barcode">
    </div>
    <div class="modal-field">
      <label>Nama Barang</label>
      <input type="text" id="addDbDesc" placeholder="Masukkan nama barang">
    </div>
    <div class="modal-field">
      <label>Ketentuan Tarik (H-)</label>
      <input type="number" id="addDbTarik" min="0" placeholder="Contoh: 7 untuk H-7">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalAddDatabase')">Batal</button>
      <button class="btn-save" onclick="saveAddDatabase(this)">Tambah</button>
    </div>
  </div>
</div>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">⚙️ Admin Panel</div>
      <div class="header-sub">Manajemen Database & Data Input</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="back-btn" id="reloadBtn" onclick="loadAllData()">↻ Muat Ulang</button>
      <button class="back-btn" onclick="window.location.href='index.html'">← Kembali</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab-btn active" id="tabBtnInputs" onclick="switchTab('inputs')">📋 Data Input</button>
    <button class="tab-btn" id="tabBtnDatabase" onclick="switchTab('database')">🗄️ Database Master</button>
  </div>

  <div id="tabInputs">
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-number" id="totalInputs">0</div><div class="stat-label">Total Input</div></div>
      <div class="stat-box"><div class="stat-number" id="todayInputs">0</div><div class="stat-label">Input Hari Ini</div></div>
    </div>
    <input type="text" class="search-box" id="searchInputs" placeholder="🔍 Cari barcode, SKU, atau nama barang...">
    <div id="inputsList"></div>
    <div id="inputsPagination" class="pagination"></div>
  </div>

  <div id="tabDatabase" style="display:none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <div style="font-size: 12px; color: var(--text-2);">Total: <strong id="totalDatabase">0</strong> item <span id="databaseResultInfo"></span></div>
      <button class="btn-add" onclick="openAddDatabaseModal()">+ Tambah Database</button>
    </div>
    <input type="text" class="search-box" id="searchDatabase" placeholder="🔍 Cari barcode, SKU, atau nama barang...">
    <div id="databaseList"></div>
    <div id="databasePagination" class="pagination"></div>
  </div>
</div>

<script src="/common.js"></script>
<script>
const ADMIN_PASSWORD = "admin123";
const ITEMS_PER_PAGE = 20;

let inputsData = [];
let databaseData = [];
let inputsPage = 1;
let databasePage = 1;
let currentEditInput = null;
let currentEditDb = null;
let isLoggedIn = false;
let isBusy = false;
let toastTimer = null;

const $ = (id) => document.getElementById(id);

function showToast(msg, type = '') {
  const t = $('toast');
  if (toastTimer) clearTimeout(toastTimer);
  t.innerText = msg; t.className = 'toast show ' + type;
  toastTimer = setTimeout(() => { t.className = 'toast'; toastTimer = null; }, 3000);
}

// Jalankan aksi tulis dengan tombol dikunci supaya tidak terkirim dua kali
async function withBusy(btn, label, fn) {
  if (isBusy) return;
  isBusy = true;
  const original = btn ? btn.innerText : '';
  if (btn) { btn.disabled = true; btn.innerText = label; }
  try { await fn(); }
  finally {
    isBusy = false;
    if (btn) { btn.disabled = false; btn.innerText = original; }
  }
}

// ========== LOAD ==========
async function loadAllData() {
  const btn = $('reloadBtn');
  btn.disabled = true;
  try {
    const [dbRes, inRes] = await Promise.all([callApi("getDatabase"), callApi("getInputs")]);
    databaseData = (dbRes.data || []).map(normalizeDbItem);
    inputsData = (inRes.data || []).map(normalizeInputItem);
    renderAllData();
    showToast("✅ Data berhasil dimuat", "success");
  } catch (e) {
    showToast("❌ Gagal load data: " + e.message, "error");
  } finally {
    btn.disabled = false;
  }
}

// rowIndex bergeser setelah ada baris yang dihapus, jadi data input dimuat ulang dari server
async function reloadInputs() {
  const inRes = await callApi("getInputs");
  inputsData = (inRes.data || []).map(normalizeInputItem);
  renderAllData();
}

function renderAllData() {
  updateStats();
  renderInputs();
  renderDatabase();
}

function updateStats() {
  const today = getTodayStr();
  $('totalInputs').innerText = inputsData.length;
  $('todayInputs').innerText = inputsData.filter(i => i.timestamp.startsWith(today)).length;
  $('totalDatabase').innerText = databaseData.length;
}

function matchSearch(item, search) {
  return item.barcode.toLowerCase().includes(search) ||
    item.description.toLowerCase().includes(search) ||
    item.sku.toLowerCase().includes(search);
}

function paginate(list, page) {
  const totalPages = Math.max(1, Math.ceil(list.length / ITEMS_PER_PAGE));
  const current = Math.min(Math.max(1, page), totalPages);
  const start = (current - 1) * ITEMS_PER_PAGE;
  return { current, totalPages, items: list.slice(start, start + ITEMS_PER_PAGE) };
}

// ========== RENDER INPUT ==========
function renderInputs() {
  const search = $('searchInputs').value.trim().toLowerCase();
  const filtered = inputsData
    .filter(item => !search || matchSearch(item, search))
    .sort((a, b) => b.timestamp.localeCompare(a.timestamp) || b.rowIndex - a.rowIndex);

  const { current, totalPages, items } = paginate(filtered, inputsPage);
  inputsPage = current;

  const container = $('inputsList');
  if (!items.length) {
    container.innerHTML = `<div class="empty-state">📭 Tidak ada data input</div>`;
  } else {
    container.innerHTML = items.map(item => {
      const skuTag = item.sku ? `<span class="sku-tag">SKU: ${escHtml(item.sku)}</span>` : '';
      return `
      <div class="data-item">
        <div class="data-name">${skuTag}${escHtml(item.description || item.barcode)}</div>
        <div class="data-barcode">📦 ${escHtml(item.barcode)}</div>
        <div class="data-detail">📅 Exp: ${formatDateIndo(item.expISO)} &nbsp;|&nbsp; 📍 ${escHtml(item.lokasi || '-')}</div>
        <div class="data-detail" style="font-size:10px;">🕐 ${escHtml(item.timestamp || '-')}</div>
        <div class="data-actions">
          <button class="btn-edit" data-action="edit" data-row="${item.rowIndex}">✏️ Edit</button>
          <button class="btn-delete" data-action="delete" data-row="${item.rowIndex}">🗑️ Hapus</button>
        </div>
      </div>`;
    }).join('');
  }
  renderPagination('inputsPagination', totalPages, current);
}

// ========== RENDER DATABASE ==========
function renderDatabase() {
  const search = $('searchDatabase').value.trim().toLowerCase();
  const filtered = databaseData
    .filter(item => !search || matchSearch(item, search))
    .sort((a, b) => a.description.localeCompare(b.description));

  const { current, totalPages, items } = paginate(filtered, databasePage);
  databasePage = current;

  const container = $('databaseList');
  if (!items.length) {
    container.innerHTML = `<div class="empty-state">🗄️ Tidak ada data database</div>`;
  } else {
    container.innerHTML = items.map(item => {
      const skuTag = item.sku ? `<span class="sku-tag">SKU: ${escHtml(item.sku)}</span>` : '';
      return `
      <div class="data-item">
        <div class="data-name">${skuTag}${escHtml(item.description)}</div>
        <div class="data-barcode">🔖 ${escHtml(item.barcode)}</div>
        <div class="data-detail">⏰ Ketentuan Tarik: <strong>H-${item.hMinus}</strong></div>
        <div class="data-actions">
          <button class="btn-edit" data-action="edit" data-barcode="${escHtml(item.barcode)}">✏️ Edit</button>
          <button class="btn-delete" data-action="delete" data-barcode="${escHtml(item.barcode)}">🗑️ Hapus</button>
        </div>
      </div>`;
    }).join('');
  }
  $('databaseResultInfo').innerText = search ? `(${filtered.length} hasil)` : '';
  renderPagination('databasePagination', totalPages, current);
}

function renderPagination(containerId, totalPages, currentPage) {
  const container = $(containerId);
  if (totalPages <= 1) { container.innerHTML = ''; return; }

  const maxButtons = 5;
  let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
  const endPage = Math.min(totalPages, startPage + maxButtons - 1);
  if (endPage - startPage + 1 < maxButtons) startPage = Math.max(1, endPage - maxButtons + 1);

  const btn = (p) => `<button class="page-btn ${p === currentPage ? 'active' : ''}" data-page="${p}">${p}</button>`;
  const dots = `<span style="padding: 8px;">...</span>`;
  let html = '';
  if (startPage > 1) html += btn(1) + (startPage > 2 ? dots : '');
  for (let i = startPage; i <= endPage; i++) html += btn(i);
  if (endPage < totalPages) html += (endPage < totalPages - 1 ? dots : '') + btn(totalPages);
  container.innerHTML = html;
}

// ========== INPUT: EDIT / DELETE ==========
function findInput(rowIndex) {
  return inputsData.find(x => String(x.rowIndex) === String(rowIndex)) || null;
}

function openEditInputModal(item) {
  currentEditInput = item;
  $('editInputBarcode').value = item.barcode;
  $('editInputSKU').value = item.sku;
  $('editInputDesc').value = item.description;
  $('editInputExp').value = item.expISO || '';
  $('editInputLokasi').value = item.lokasi;
  $('modalEditInput').classList.add('open');
}

async function saveEditInput(btn) {
  if (!currentEditInput) return;
  const data = {
    rowIndex: currentEditInput.rowIndex,
    barcode: $('editInputBarcode').value.trim(),
    sku: $('editInputSKU').value.trim(),
    description: $('editInputDesc').value.trim(),
    expiredDate: $('editInputExp').value,
    lokasi: $('editInputLokasi').value.trim(),
    // Untuk verifikasi di server bahwa baris belum bergeser
    expectedBarcode: currentEditInput.barcode,
    expectedTimestamp: currentEditInput.timestamp
  };
  if (!data.barcode || !data.description || !data.expiredDate || !data.lokasi) {
    return showToast("Semua field wajib diisi!", "error");
  }
  await withBusy(btn, 'Menyimpan...', async () => {
    try {
      await callApi("updateInput", data);
      const idx = inputsData.indexOf(currentEditInput);
      const { expectedBarcode, expectedTimestamp, ...fields } = data;
      if (idx !== -1) inputsData[idx] = normalizeInputItem({ ...currentEditInput, ...fields });
      showToast("✅ Data berhasil diupdate", "success");
      closeModal('modalEditInput');
      renderAllData();
    } catch (e) { showToast("❌ Gagal update: " + e.message, "error"); }
  });
}

async function deleteInput(item) {
  if (!confirm(`Yakin ingin menghapus data input ini?\n\n${item.description}\nExp: ${formatDateIndo(item.expISO)}\n\nData yang dihapus tidak bisa dikembalikan!`)) return;
  await withBusy(null, '', async () => {
    try {
      await callApi("deleteInput", {
        rowIndex: item.rowIndex,
        expectedBarcode: item.barcode,
        expectedTimestamp: item.timestamp
      });
      showToast("✅ Data berhasil dihapus", "success");
    } catch (e) {
      showToast("❌ Gagal hapus: " + e.message, "error");
    }
    try { await reloadInputs(); }
    catch (e) { showToast("⚠️ Gagal memuat ulang data, tekan Muat Ulang", "error"); }
  });
}

// ========== DATABASE: EDIT / DELETE / ADD ==========
function findDb(barcode) {
  return databaseData.find(x => x.barcode === barcode) || null;
}

function openEditDatabaseModal(item) {
  currentEditDb = item;
  $('editDbOldBarcode').value = item.barcode;
  $('editDbSKU').value = item.sku;
  $('editDbBarcode').value = item.barcode;
  $('editDbDesc').value = item.description;
  $('editDbTarik').value = item.hMinus;
  $('modalEditDatabase').classList.add('open');
}

function isBarcodeTaken(barcode, exceptItem = null) {
  const key = barcodeKey(barcode);
  return databaseData.some(item => item !== exceptItem && barcodeKey(item.barcode) === key);
}

async function saveEditDatabase(btn) {
  if (!currentEditDb) return;
  const data = {
    oldBarcode: $('editDbOldBarcode').value,
    sku: $('editDbSKU').value.trim(),
    barcode: $('editDbBarcode').value.trim(),
    description: $('editDbDesc').value.trim(),
    hMinus: parseInt($('editDbTarik').value) || 0
  };
  if (!data.sku || !data.barcode || !data.description) {
    return showToast("Semua field wajib diisi!", "error");
  }
  if (!/^\d+$/.test(data.barcode)) return showToast("⚠️ Barcode harus berupa angka", "error");
  if (isBarcodeTaken(data.barcode, currentEditDb)) return showToast("⚠️ Barcode sudah dipakai item lain!", "error");

  await withBusy(btn, 'Menyimpan...', async () => {
    try {
      await callApi("updateDatabase", data);
      Object.assign(currentEditDb, { sku: data.sku, barcode: data.barcode, description: data.description, hMinus: data.hMinus });
      showToast("✅ Database berhasil diupdate", "success");
      closeModal('modalEditDatabase');
      renderAllData();
    } catch (e) { showToast("❌ Gagal update: " + e.message, "error"); }
  });
}

async function deleteDatabase(item) {
  if (!confirm(`Yakin ingin menghapus data database ini?\n\n${item.description}\nBarcode: ${item.barcode}\n\nSemua input yang terkait dengan barcode ini akan tetap ada!`)) return;
  await withBusy(null, '', async () => {
    try {
      await callApi("deleteDatabase", { barcode: item.barcode });
      databaseData = databaseData.filter(i => i !== item);
      showToast("✅ Database berhasil dihapus", "success");
      renderAllData();
    } catch (e) { showToast("❌ Gagal hapus: " + e.message, "error"); }
  });
}

function openAddDatabaseModal() {
  $('addDbSKU').value = '';
  $('addDbBarcode').value = '';
  $('addDbDesc').value = '';
  $('addDbTarik').value = '0';
  $('modalAddDatabase').classList.add('open');
}

async function saveAddDatabase(btn) {
  const sku = $('addDbSKU').value.trim();
  const barcode = $('addDbBarcode').value.trim();
  const description = $('addDbDesc').value.trim();
  const hMinus = parseInt($('addDbTarik').value) || 0;

  if (!sku || !barcode || !description) return showToast("Semua field wajib diisi!", "error");
  if (!/^\d+$/.test(barcode)) return showToast("⚠️ Barcode harus berupa angka", "error");
  if (isBarcodeTaken(barcode)) return showToast("⚠️ Barcode sudah ada di database!", "error");

  await withBusy(btn, 'Menambah...', async () => {
    try {
      await callApi("addDatabase", { sku, barcode, description, hMinus });
      databaseData.push(normalizeDbItem({ sku, barcode, description, hMinus }));
      showToast("✅ Database berhasil ditambahkan", "success");
      closeModal('modalAddDatabase');
      renderAllData();
    } catch (e) { showToast("❌ Gagal tambah: " + e.message, "error"); }
  });
}

// ========== UI ==========
function switchTab(tab) {
  const isInputs = tab === 'inputs';
  $('tabBtnInputs').classList.toggle('active', isInputs);
  $('tabBtnDatabase').classList.toggle('active', !isInputs);
  $('tabInputs').style.display = isInputs ? 'block' : 'none';
  $('tabDatabase').style.display = isInputs ? 'none' : 'block';
}

function closeModal(modalId) {
  $(modalId).classList.remove('open');
}

// ========== EVENT DELEGATION ==========
$('inputsList').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  const item = btn && findInput(btn.dataset.row);
  if (!item) return;
  if (btn.dataset.action === 'edit') openEditInputModal(item); else deleteInput(item);
});

$('databaseList').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-action]');
  const item = btn && findDb(btn.dataset.barcode);
  if (!item) return;
  if (btn.dataset.action === 'edit') openEditDatabaseModal(item); else deleteDatabase(item);
});

$('inputsPagination').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-page]');
  if (btn) { inputsPage = Number(btn.dataset.page); renderInputs(); }
});

$('databasePagination').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-page]');
  if (btn) { databasePage = Number(btn.dataset.page); renderDatabase(); }
});

$('searchInputs').addEventListener('input', () => { inputsPage = 1; renderInputs(); });
$('searchDatabase').addEventListener('input', () => { databasePage = 1; renderDatabase(); });

// LOGIN FUNCTIONS
function openLoginModal() { document.getElementById('loginModal').classList.add('open'); }
function closeLoginModal() { document.getElementById('loginModal').classList.remove('open'); }

function doLogin() {
  const pass = document.getElementById('loginPassword').value;
  if (pass !== ADMIN_PASSWORD) {
    showToast("❌ Password salah!", "error");
    return;
  }
  isLoggedIn = true;
  closeLoginModal();
  document.getElementById('loginPassword').value = '';
  loadAllData();
  showToast("✅ Login berhasil! Selamat datang di Admin Panel", "success");
}

window.onload = () => {
  openLoginModal();

};

document.querySelectorAll('.modal-overlay').forEach(modal => {
  modal.addEventListener('click', (e) => { 
    if (e.target === modal) modal.classList.remove('open'); 
  });
});
