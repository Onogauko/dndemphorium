<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Panel - Expired Control D&D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --magenta: #c026d3;
  --magenta-light: #fae8ff;
  --magenta-mid: #d946ef;
  --red: #dc2626;
  --red-light: #fee2e2;
  --green: #059669;
  --surface: #ffffff;
  --bg: #fdf4ff;
  --border: #f0e0f7;
  --text: #1c1033;
  --text-2: #6b7280;
  --text-3: #c084fc;
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); max-width: 430px; margin: 0 auto; min-height: 100vh; }

.header { background: var(--magenta); padding: 50px 20px 20px; }
.header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.header-title { color: #fff; font-size: 20px; font-weight: 600; }
.header-sub { color: rgba(255,255,255,0.55); font-size: 12px; margin-top: 2px; }
.back-btn { background: rgba(255,255,255,0.15); border: none; color: white; border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.back-btn:hover { background: rgba(255,255,255,0.25); }

.main { padding: 16px; }
.inp { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 13px; font-size: 13px; margin-bottom: 8px; outline: none; font-family: 'DM Sans', sans-serif; }
.inp:focus { border-color: var(--magenta-mid); }

.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-box { background: white; border-radius: 12px; padding: 12px; text-align: center; border: 1px solid var(--border); }
.stat-number { font-size: 28px; font-weight: 700; color: var(--magenta); }
.stat-label { font-size: 11px; color: var(--text-2); }

.search-box { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 12px; font-size: 14px; margin-bottom: 16px; outline: none; font-family: 'DM Sans', sans-serif; }
.search-box:focus { border-color: var(--magenta-mid); }

.data-item { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; transition: all 0.2s; }
.data-item:hover { border-color: var(--magenta-mid); }
.data-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.data-barcode { font-size: 11px; color: var(--text-2); margin-bottom: 6px; font-family: 'DM Mono', monospace; }
.data-detail { font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.data-actions { display: flex; gap: 8px; }
.btn-edit { flex: 1; background: var(--magenta-light); border: none; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 600; color: var(--magenta); cursor: pointer; font-family: 'DM Sans', sans-serif; }
.btn-edit:active { background: var(--magenta-mid); color: white; }
.btn-delete { flex: 1; background: var(--red-light); border: none; border-radius: 8px; padding: 8px; font-size: 12px; font-weight: 600; color: var(--red); cursor: pointer; font-family: 'DM Sans', sans-serif; }
.btn-delete:active { background: var(--red); color: white; }
.btn-add { background: var(--magenta); color: white; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; cursor: pointer; margin-bottom: 16px; font-family: 'DM Sans', sans-serif; }
.btn-add:active { background: var(--magenta-mid); }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150; display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal-card { background: white; width: 100%; max-width: 430px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-weight: 700; font-size: 18px; margin-bottom: 20px; color: var(--magenta); }
.modal-field { margin-bottom: 16px; }
.modal-field label { font-size: 12px; font-weight: 600; color: var(--text-2); display: block; margin-bottom: 6px; }
.modal-field input { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; outline: none; font-family: 'DM Sans', sans-serif; }
.modal-field input:focus { border-color: var(--magenta-mid); }
.modal-actions { display: flex; gap: 12px; margin-top: 24px; }
.btn-cancel { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.btn-save { flex: 1; background: var(--magenta); border: none; border-radius: 10px; padding: 12px; font-weight: 600; color: white; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.btn-save:active { background: var(--magenta-mid); }

.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tab-btn { flex: 1; background: white; border: 1.5px solid var(--border); border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text-2); font-family: 'DM Sans', sans-serif; }
.tab-btn.active { background: var(--magenta); color: white; border-color: var(--magenta); }

.pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.page-btn { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.page-btn.active { background: var(--magenta); color: white; border-color: var(--magenta); }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text-2); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1c1033; color: white; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 1000; transition: transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1); }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: #065f46; }
.toast.error { background: #7f1d1d; }

.sku-tag {
  display: inline-block;
  background: var(--magenta-light);
  color: var(--magenta);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  margin-right: 6px;
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOGIN MODAL -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-card">
    <div class="modal-title">🔐 Login Admin Panel</div>
    <div class="modal-field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Masukkan password admin" onkeypress="if(event.key==='Enter') doLogin()">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="window.location.href='index.html'">← Kembali</button>
      <button class="btn-save" onclick="doLogin()">Login</button>
    </div>
  </div>
</div>

<!-- EDIT INPUT MODAL -->
<div class="modal-overlay" id="modalEditInput">
  <div class="modal-card">
    <div class="modal-title">✏️ Edit Data Input</div>
    <div class="modal-field">
      <label>Barcode</label>
      <input type="text" id="editInputBarcode" readonly style="background:#f0f0f0;">
    </div>
    <div class="modal-field">
      <label>SKU</label>
      <input type="text" id="editInputSKU" readonly style="background:#f0f0f0;">
    </div>
    <div class="modal-field">
      <label>Nama Barang</label>
      <input type="text" id="editInputDesc">
    </div>
    <div class="modal-field">
      <label>Tanggal Expired</label>
      <input type="date" id="editInputExp">
    </div>
    <div class="modal-field">
      <label>Lokasi</label>
      <input type="text" id="editInputLokasi">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalEditInput')">Batal</button>
      <button class="btn-save" onclick="saveEditInput()">Simpan</button>
    </div>
  </div>
</div>

<!-- EDIT DATABASE MODAL -->
<div class="modal-overlay" id="modalEditDatabase">
  <div class="modal-card">
    <div class="modal-title">✏️ Edit Database</div>
    <input type="hidden" id="editDbOldBarcode">
    <div class="modal-field">
      <label>SKU</label>
      <input type="text" id="editDbSKU">
    </div>
    <div class="modal-field">
      <label>Barcode</label>
      <input type="text" id="editDbBarcode">
    </div>
    <div class="modal-field">
      <label>Nama Barang</label>
      <input type="text" id="editDbDesc">
    </div>
    <div class="modal-field">
      <label>Ketentuan Tarik (H-)</label>
      <input type="number" id="editDbTarik" min="0" placeholder="Contoh: 7 untuk H-7">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalEditDatabase')">Batal</button>
      <button class="btn-save" onclick="saveEditDatabase()">Simpan</button>
    </div>
  </div>
</div>

<!-- ADD DATABASE MODAL -->
<div class="modal-overlay" id="modalAddDatabase">
  <div class="modal-card">
    <div class="modal-title">➕ Tambah Database Baru</div>
    <div class="modal-field">
      <label>SKU</label>
      <input type="text" id="addDbSKU" placeholder="Masukkan SKU">
    </div>
    <div class="modal-field">
      <label>Barcode</label>
      <input type="text" id="addDbBarcode" placeholder="Masukkan barcode">
    </div>
    <div class="modal-field">
      <label>Nama Barang</label>
      <input type="text" id="addDbDesc" placeholder="Masukkan nama barang">
    </div>
    <div class="modal-field">
      <label>Ketentuan Tarik (H-)</label>
      <input type="number" id="addDbTarik" min="0" placeholder="Contoh: 7 untuk H-7">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modalAddDatabase')">Batal</button>
      <button class="btn-save" onclick="saveAddDatabase()">Tambah</button>
    </div>
  </div>
</div>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">⚙️ Admin Panel</div>
      <div class="header-sub">Manajemen Database & Data Input</div>
    </div>
    <button class="back-btn" onclick="window.location.href='index.html'">← Kembali</button>
  </div>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('inputs')">📋 Data Input</button>
    <button class="tab-btn" onclick="switchTab('database')">🗄️ Database Master</button>
  </div>

  <div id="tabInputs">
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-number" id="totalInputs">0</div><div class="stat-label">Total Input</div></div>
      <div class="stat-box"><div class="stat-number" id="todayInputs">0</div><div class="stat-label">Input Hari Ini</div></div>
    </div>
    <input type="text" class="search-box" id="searchInputs" placeholder="🔍 Cari barcode, SKU, atau nama barang..." oninput="renderInputs()">
    <div id="inputsList"></div>
    <div id="inputsPagination" class="pagination"></div>
  </div>

  <div id="tabDatabase" style="display:none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <div style="font-size: 12px; color: var(--text-2);">Total: <strong id="totalDatabase">0</strong> item</div>
      <button class="btn-add" onclick="openAddDatabaseModal()">+ Tambah Database</button>
    </div>
    <input type="text" class="search-box" id="searchDatabase" placeholder="🔍 Cari barcode, SKU, atau nama barang..." oninput="renderDatabase()">
    <div id="databaseList"></div>
    <div id="databasePagination" class="pagination"></div>
  </div>
</div>

<script>
"use strict";

/*
 * ADMIN PANEL - Frontend v4
 *
 * Perbaikan:
 * - Barcode selalu dinormalisasi saat compare.
 * - Update Database mengirim oldBarcode + oldBarcodeNormalized.
 * - Duplicate barcode dicek sebelum add/update.
 * - Pagination tidak memakai global _pageCallback.
 * - Dynamic HTML tidak menyisipkan object JSON ke onclick.
 * - Error API ditampilkan apa adanya.
 *
 * PENTING:
 * Password di frontend BUKAN security yang sebenarnya.
 * Backend Apps Script harus tetap memvalidasi akses admin.
 */

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwoRnzRYCyoIj9MAyeO0jfYEOahsc7a4IWwcLK5LAMUQeCDt7t-A4r73ee7qh89gf7e/exec";
const API_TOKEN = "MAGENTA_AEON_2024";
const ADMIN_PASSWORD = "admin123";
const SPREADSHEET_ID = "1djq5Vrrlr-ePGs2TuJCxyGjoVAUp0mbz0zwZRlF3dE";

const ITEMS_PER_PAGE = 20;

let inputsData = [];
let databaseData = [];
let inputsPage = 1;
let databasePage = 1;
let currentEditInput = null;
let currentEditDb = null;
let isLoggedIn = false;
let toastTimer = null;

function normalizeBarcode(value) {
  if (value === null || value === undefined) return "";

  let s = String(value).trim();

  if (/^\d+\.0+$/.test(s)) {
    s = s.replace(/\.0+$/, "");
  }

  return s.replace(/\D/g, "");
}

function normalizeText(value) {
  return String(value ?? "").trim().toLowerCase();
}

function escHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getTodayStr() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Jakarta",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const get = type => parts.find(p => p.type === type)?.value || "";
  return `${get("year")}-${get("month")}-${get("day")}`;
}

function parseISODate(raw) {
  if (!raw) return null;

  const s = String(raw).trim();

  let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (m) {
    return `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")}`;
  }

  m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
  if (m) {
    // Data operasional Indonesia diperlakukan DD/MM/YYYY.
    return `${m[3]}-${String(m[2]).padStart(2, "0")}-${String(m[1]).padStart(2, "0")}`;
  }

  return null;
}

function formatDateIndo(raw) {
  if (!raw) return "-";

  const iso = parseISODate(raw);
  if (!iso) return String(raw);

  const [y, m, d] = iso.split("-").map(Number);
  const months = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

  return `${d} ${months[m - 1]} ${y}`;
}

function showToast(msg, type = "") {
  const t = document.getElementById("toast");
  if (!t) return;

  if (toastTimer) clearTimeout(toastTimer);

  t.innerText = msg;
  t.className = `toast show ${type}`;

  toastTimer = setTimeout(() => {
    t.className = "toast";
  }, 3500);
}

/* =========================
   API
========================= */

async function callApi(params, body = null) {
  const formData = new URLSearchParams();

  formData.append("action", params.action);
  formData.append("token", API_TOKEN);

  if (body) {
    Object.entries(body).forEach(([key, value]) => {
      if (value !== undefined && value !== null) {
        formData.append(key, String(value));
      }
    });
  }

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
      },
      body: formData.toString(),
      cache: "no-store"
    });

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const json = await res.json();

    if (json?.error) {
      throw new Error(json.error);
    }

    return json;
  } catch (e) {
    console.error("API Error:", e);
    throw new Error(e.message || "Gagal terhubung ke server");
  }
}

/* =========================
   LOAD
========================= */

async function loadAllData() {
  try {
    const [dbRes, inRes] = await Promise.all([
      callApi({ action: "getDatabase" }),
      callApi({ action: "getInputs" })
    ]);

    databaseData = (dbRes.data || []).map(item => ({
      ...item,
      sku: String(item.sku ?? ""),
      barcode: String(item.barcode ?? ""),
      description: String(item.description ?? ""),
      hMinus: Math.max(0, parseInt(item.hMinus, 10) || 0)
    }));

    inputsData = (inRes.data || []).map(item => ({
      ...item,
      barcode: String(item.barcode ?? ""),
      sku: String(item.sku ?? ""),
      description: String(item.description ?? ""),
      lokasi: String(item.lokasi ?? ""),
      expiredDate: parseISODate(item.expiredDate) || String(item.expiredDate || "")
    }));

    document.getElementById("totalDatabase").innerText =
      databaseData.length;

    updateStats();
    renderInputs();
    renderDatabase();

    showToast("✅ Data berhasil dimuat", "success");
  } catch (e) {
    showToast("❌ Gagal load data: " + e.message, "error");
  }
}

function updateStats() {
  const today = getTodayStr();

  const todayInputs = inputsData.filter(i =>
    String(i.timestamp || "").startsWith(today)
  ).length;

  document.getElementById("totalInputs").innerText =
    inputsData.length;

  document.getElementById("todayInputs").innerText =
    todayInputs;
}

/* =========================
   INPUT LIST
========================= */

function renderInputs() {
  const search = normalizeText(
    document.getElementById("searchInputs")?.value || ""
  );

  let filtered = inputsData.slice();

  if (search) {
    filtered = filtered.filter(item =>
      normalizeText(item.barcode).includes(search) ||
      normalizeText(item.description).includes(search) ||
      normalizeText(item.sku).includes(search)
    );
  }

  filtered.sort(
    (a, b) =>
      new Date(b.timestamp || 0) - new Date(a.timestamp || 0)
  );

  const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);

  if (inputsPage > totalPages && totalPages > 0) {
    inputsPage = totalPages;
  }

  if (inputsPage < 1) inputsPage = 1;

  const start = (inputsPage - 1) * ITEMS_PER_PAGE;
  const paginated = filtered.slice(
    start,
    start + ITEMS_PER_PAGE
  );

  const container = document.getElementById("inputsList");

  if (!paginated.length) {
    container.innerHTML =
      `<div class="empty-state">📭 Tidak ada data input</div>`;
  } else {
    container.innerHTML = paginated.map((item, index) => {
      const skuTag = item.sku
        ? `<span class="sku-tag">SKU: ${escHtml(item.sku)}</span>`
        : "";

      return `
        <div class="data-item">
          <div class="data-name">
            ${skuTag}${escHtml(item.description || item.barcode)}
          </div>

          <div class="data-barcode">
            📦 ${escHtml(item.barcode)}
          </div>

          <div class="data-detail">
            📅 Exp: ${formatDateIndo(item.expiredDate)}
            &nbsp;|&nbsp;
            📍 ${escHtml(item.lokasi || "-")}
          </div>

          <div class="data-detail" style="font-size:10px;">
            🕐 ${escHtml(item.timestamp || "-")}
          </div>

          <div class="data-actions">
            <button
              class="btn-edit"
              data-action="edit-input"
              data-index="${index}"
            >✏️ Edit</button>

            <button
              class="btn-delete"
              data-action="delete-input"
              data-row="${escHtml(String(item.rowIndex ?? ""))}"
            >🗑️ Hapus</button>
          </div>
        </div>
      `;
    }).join("");

    container.querySelectorAll('[data-action="edit-input"]').forEach(btn => {
      btn.addEventListener("click", () => {
        const item = paginated[Number(btn.dataset.index)];
        openEditInputModal(item);
      });
    });

    container.querySelectorAll('[data-action="delete-input"]').forEach(btn => {
      btn.addEventListener("click", () => {
        deleteInput(btn.dataset.row);
      });
    });
  }

  renderPagination(
    "inputsPagination",
    totalPages,
    inputsPage,
    page => {
      inputsPage = page;
      renderInputs();
    }
  );
}

/* =========================
   DATABASE LIST
========================= */

function renderDatabase() {
  const search = normalizeText(
    document.getElementById("searchDatabase")?.value || ""
  );

  let filtered = databaseData.slice();

  if (search) {
    filtered = filtered.filter(item =>
      normalizeText(item.barcode).includes(search) ||
      normalizeText(item.description).includes(search) ||
      normalizeText(item.sku).includes(search)
    );
  }

  filtered.sort((a, b) =>
    normalizeText(a.description).localeCompare(
      normalizeText(b.description)
    )
  );

  const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);

  if (databasePage > totalPages && totalPages > 0) {
    databasePage = totalPages;
  }

  if (databasePage < 1) databasePage = 1;

  const start = (databasePage - 1) * ITEMS_PER_PAGE;
  const paginated = filtered.slice(
    start,
    start + ITEMS_PER_PAGE
  );

  const container = document.getElementById("databaseList");

  if (!paginated.length) {
    container.innerHTML =
      `<div class="empty-state">🗄️ Tidak ada data database</div>`;
  } else {
    container.innerHTML = paginated.map((item, index) => {
      const skuTag = item.sku
        ? `<span class="sku-tag">SKU: ${escHtml(item.sku)}</span>`
        : "";

      return `
        <div class="data-item">
          <div class="data-name">
            ${skuTag}${escHtml(item.description || "-")}
          </div>

          <div class="data-barcode">
            🔖 ${escHtml(item.barcode || "-")}
          </div>

          <div class="data-detail">
            ⏰ Ketentuan Tarik:
            <strong>H-${Number(item.hMinus || 0)}</strong>
          </div>

          <div class="data-actions">
            <button
              class="btn-edit"
              data-action="edit-db"
              data-index="${index}"
            >✏️ Edit</button>

            <button
              class="btn-delete"
              data-action="delete-db"
              data-index="${index}"
            >🗑️ Hapus</button>
          </div>
        </div>
      `;
    }).join("");

    container.querySelectorAll('[data-action="edit-db"]').forEach(btn => {
      btn.addEventListener("click", () => {
        openEditDatabaseModal(
          paginated[Number(btn.dataset.index)]
        );
      });
    });

    container.querySelectorAll('[data-action="delete-db"]').forEach(btn => {
      btn.addEventListener("click", () => {
        deleteDatabase(
          paginated[Number(btn.dataset.index)].barcode
        );
      });
    });
  }

  document.getElementById("totalDatabase").innerText =
    filtered.length;

  renderPagination(
    "databasePagination",
    totalPages,
    databasePage,
    page => {
      databasePage = page;
      renderDatabase();
    }
  );
}

/* =========================
   PAGINATION
========================= */

function renderPagination(
  containerId,
  totalPages,
  currentPage,
  onPageChange
) {
  const container = document.getElementById(containerId);

  if (!container) return;

  if (totalPages <= 1) {
    container.innerHTML = "";
    return;
  }

  let start = Math.max(1, currentPage - 2);
  let end = Math.min(totalPages, start + 4);

  if (end - start < 4) {
    start = Math.max(1, end - 4);
  }

  let html = "";

  if (start > 1) {
    html += `
      <button class="page-btn" data-page="1">1</button>
    `;

    if (start > 2) {
      html += `<span style="padding:8px;">...</span>`;
    }
  }

  for (let page = start; page <= end; page++) {
    html += `
      <button
        class="page-btn ${page === currentPage ? "active" : ""}"
        data-page="${page}"
      >${page}</button>
    `;
  }

  if (end < totalPages) {
    if (end < totalPages - 1) {
      html += `<span style="padding:8px;">...</span>`;
    }

    html += `
      <button
        class="page-btn"
        data-page="${totalPages}"
      >${totalPages}</button>
    `;
  }

  container.innerHTML = html;

  container.querySelectorAll("[data-page]").forEach(btn => {
    btn.addEventListener("click", () => {
      onPageChange(Number(btn.dataset.page));
    });
  });
}

/* =========================
   EDIT INPUT
========================= */

function openEditInputModal(item) {
  currentEditInput = item;

  document.getElementById("editInputBarcode").value =
    item.barcode || "";

  document.getElementById("editInputSKU").value =
    item.sku || "";

  document.getElementById("editInputDesc").value =
    item.description || "";

  document.getElementById("editInputExp").value =
    parseISODate(item.expiredDate) || "";

  document.getElementById("editInputLokasi").value =
    item.lokasi || "";

  document.getElementById("modalEditInput").classList.add("open");
}

async function saveEditInput() {
  if (!currentEditInput) return;

  const data = {
    rowIndex: currentEditInput.rowIndex,
    barcode: document.getElementById("editInputBarcode").value.trim(),
    sku: document.getElementById("editInputSKU").value.trim(),
    description: document.getElementById("editInputDesc").value.trim(),
    expiredDate: document.getElementById("editInputExp").value,
    lokasi: document.getElementById("editInputLokasi").value.trim()
  };

  if (
    !data.barcode ||
    !data.description ||
    !data.expiredDate ||
    !data.lokasi
  ) {
    showToast("Semua field wajib diisi!", "error");
    return;
  }

  try {
    await callApi(
      { action: "updateInput" },
      data
    );

    const idx = inputsData.findIndex(
      x => String(x.rowIndex) === String(currentEditInput.rowIndex)
    );

    if (idx !== -1) {
      inputsData[idx] = {
        ...inputsData[idx],
        ...data
      };
    }

    closeModal("modalEditInput");
    updateStats();
    renderInputs();

    showToast("✅ Data berhasil diupdate", "success");
  } catch (e) {
    showToast(
      "❌ Gagal update: " + e.message,
      "error"
    );
  }
}

async function deleteInput(rowIndex) {
  if (!rowIndex) {
    showToast("❌ Row data tidak valid", "error");
    return;
  }

  if (!confirm(
    "Yakin ingin menghapus data input ini?\n\n" +
    "Data yang dihapus tidak bisa dikembalikan!"
  )) return;

  try {
    await callApi(
      { action: "deleteInput" },
      { rowIndex }
    );

    inputsData = inputsData.filter(
      x => String(x.rowIndex) !== String(rowIndex)
    );

    updateStats();
    renderInputs();

    showToast("✅ Data berhasil dihapus", "success");
  } catch (e) {
    showToast(
      "❌ Gagal hapus: " + e.message,
      "error"
    );
  }
}

/* =========================
   EDIT DATABASE
========================= */

function openEditDatabaseModal(item) {
  currentEditDb = item;

  document.getElementById("editDbOldBarcode").value =
    item.barcode || "";

  document.getElementById("editDbSKU").value =
    item.sku || "";

  document.getElementById("editDbBarcode").value =
    item.barcode || "";

  document.getElementById("editDbDesc").value =
    item.description || "";

  document.getElementById("editDbTarik").value =
    Number(item.hMinus || 0);

  document.getElementById("modalEditDatabase").classList.add("open");
}

async function saveEditDatabase() {
  if (!currentEditDb) return;

  const oldBarcode = document
    .getElementById("editDbOldBarcode")
    .value.trim();

  const newBarcode = document
    .getElementById("editDbBarcode")
    .value.trim();

  const sku = document
    .getElementById("editDbSKU")
    .value.trim();

  const description = document
    .getElementById("editDbDesc")
    .value.trim();

  const hMinusRaw = document
    .getElementById("editDbTarik")
    .value;

  const hMinus = Math.max(
    0,
    parseInt(hMinusRaw, 10) || 0
  );

  if (!sku || !newBarcode || !description) {
    showToast("SKU, Barcode, dan Nama Barang wajib diisi!", "error");
    return;
  }

  const oldNormalized = normalizeBarcode(oldBarcode);
  const newNormalized = normalizeBarcode(newBarcode);

  if (!oldNormalized || !newNormalized) {
    showToast("❌ Barcode tidak valid", "error");
    return;
  }

  // Cek duplicate hanya terhadap item lain.
  const duplicate = databaseData.find(item => {
    const sameBarcode =
      normalizeBarcode(item.barcode) === newNormalized;

    const sameCurrentItem =
      normalizeBarcode(item.barcode) === oldNormalized;

    return sameBarcode && !sameCurrentItem;
  });

  if (duplicate) {
    showToast(
      "⚠️ Barcode baru sudah digunakan oleh produk lain!",
      "error"
    );
    return;
  }

  const data = {
    oldBarcode,
    oldBarcodeNormalized: oldNormalized,
    barcode: newBarcode,
    barcodeNormalized: newNormalized,
    sku,
    description,
    hMinus
  };

  const saveBtn = document.querySelector(
    "#modalEditDatabase .btn-save"
  );

  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.innerText = "Menyimpan...";
  }

  try {
    /*
     * Penting:
     * oldBarcodeNormalized dikirim supaya backend baru bisa mencari
     * barcode secara konsisten meskipun Google Sheets mengembalikannya
     * sebagai Number/String/123.0.
     */
    await callApi(
      { action: "updateDatabase" },
      data
    );

    const idx = databaseData.findIndex(item =>
      normalizeBarcode(item.barcode) === oldNormalized
    );

    if (idx !== -1) {
      databaseData[idx] = {
        ...databaseData[idx],
        sku,
        barcode: newBarcode,
        description,
        hMinus
      };
    }

    closeModal("modalEditDatabase");
    renderDatabase();

    showToast("✅ Database berhasil diupdate", "success");

    // Refresh dari server agar frontend tidak berbeda dengan Sheet.
    await loadAllData();
  } catch (e) {
    showToast(
      "❌ Gagal update: " + e.message,
      "error"
    );
  } finally {
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.innerText = "Simpan";
    }
  }
}

async function deleteDatabase(barcode) {
  const normalized = normalizeBarcode(barcode);

  if (!normalized) {
    showToast("❌ Barcode tidak valid", "error");
    return;
  }

  if (!confirm(
    "Yakin ingin menghapus data database ini?\n\n" +
    "Semua input yang terkait dengan barcode ini akan tetap ada!"
  )) return;

  try {
    await callApi(
      { action: "deleteDatabase" },
      {
        barcode,
        barcodeNormalized: normalized
      }
    );

    databaseData = databaseData.filter(
      item => normalizeBarcode(item.barcode) !== normalized
    );

    renderDatabase();

    showToast(
      "✅ Database berhasil dihapus",
      "success"
    );
  } catch (e) {
    showToast(
      "❌ Gagal hapus: " + e.message,
      "error"
    );
  }
}

/* =========================
   ADD DATABASE
========================= */

function openAddDatabaseModal() {
  document.getElementById("addDbSKU").value = "";
  document.getElementById("addDbBarcode").value = "";
  document.getElementById("addDbDesc").value = "";
  document.getElementById("addDbTarik").value = "0";

  document.getElementById("modalAddDatabase").classList.add("open");
}

async function saveAddDatabase() {
  const sku = document.getElementById("addDbSKU").value.trim();
  const barcode = document.getElementById("addDbBarcode").value.trim();
  const description = document.getElementById("addDbDesc").value.trim();
  const hMinus = Math.max(
    0,
    parseInt(document.getElementById("addDbTarik").value, 10) || 0
  );

  if (!sku || !barcode || !description) {
    showToast("Semua field wajib diisi!", "error");
    return;
  }

  const normalized = normalizeBarcode(barcode);

  if (!normalized) {
    showToast("❌ Barcode tidak valid", "error");
    return;
  }

  if (databaseData.some(item =>
    normalizeBarcode(item.barcode) === normalized
  )) {
    showToast(
      "⚠️ Barcode sudah ada di database!",
      "error"
    );
    return;
  }

  const btn = document.querySelector(
    "#modalAddDatabase .btn-save"
  );

  if (btn) {
    btn.disabled = true;
    btn.innerText = "Menambah...";
  }

  try {
    await callApi(
      { action: "addDatabase" },
      {
        sku,
        barcode,
        barcodeNormalized: normalized,
        description,
        hMinus
      }
    );

    databaseData.push({
      sku,
      barcode,
      description,
      hMinus
    });

    closeModal("modalAddDatabase");
    renderDatabase();

    showToast(
      "✅ Database berhasil ditambahkan",
      "success"
    );

    await loadAllData();
  } catch (e) {
    showToast(
      "❌ Gagal tambah: " + e.message,
      "error"
    );
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerText = "Tambah";
    }
  }
}

/* =========================
   TABS / MODALS / LOGIN
========================= */

function switchTab(tab) {
  const tabInputs = document.getElementById("tabInputs");
  const tabDatabase = document.getElementById("tabDatabase");
  const btns = document.querySelectorAll(".tabs .tab-btn");

  btns.forEach((btn, index) => {
    const active =
      (tab === "inputs" && index === 0) ||
      (tab === "database" && index === 1);

    btn.classList.toggle("active", active);
  });

  if (tab === "inputs") {
    tabInputs.style.display = "block";
    tabDatabase.style.display = "none";
    inputsPage = 1;
    renderInputs();
  } else {
    tabInputs.style.display = "none";
    tabDatabase.style.display = "block";
    databasePage = 1;
    renderDatabase();
  }
}

function closeModal(modalId) {
  document.getElementById(modalId)?.classList.remove("open");
}

function openLoginModal() {
  document.getElementById("loginModal").classList.add("open");
}

function closeLoginModal() {
  document.getElementById("loginModal").classList.remove("open");
}

function doLogin() {
  const pass =
    document.getElementById("loginPassword").value;

  if (pass !== ADMIN_PASSWORD) {
    showToast("❌ Password salah!", "error");
    return;
  }

  isLoggedIn = true;
  closeLoginModal();

  document.getElementById("loginPassword").value = "";

  loadAllData();

  showToast(
    "✅ Login berhasil! Selamat datang di Admin Panel",
    "success"
  );
}
