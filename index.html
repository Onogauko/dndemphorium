<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Expired Control D&D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#c026d3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Expired Ctrl">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">

<style>
:root {
  --magenta: #c026d3; --magenta-light: #fae8ff; --magenta-mid: #d946ef;
  --red: #dc2626; --red-light: #fee2e2;
  --amber: #d97706; --amber-light: #fef3c7;
  --green: #059669; --green-light: #d1fae5;
  --surface: #ffffff; --bg: #fdf4ff;
  --border: #f0e0f7; --text: #1c1033;
  --text-2: #6b7280; --text-3: #c084fc;
  --radius: 16px; --radius-sm: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); max-width: 430px; margin: 0 auto; min-height: 100vh; }

/* HEADER */
.header { background: var(--magenta); padding: 50px 20px 0; position: sticky; top: 0; z-index: 50; }
.header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.header-title { color: #fff; font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
.header-date { color: rgba(255,255,255,0.55); font-size: 12px; margin-top: 2px; }
.sync-btn { background: rgba(255,255,255,0.15); border: none; color: white; border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.2s; }
.sync-btn:active { background: rgba(255,255,255,0.25); }

/* TABS */
.tabs { display: flex; gap: 4px; background: rgba(0,0,0,0.2); border-radius: 12px 12px 0 0; padding: 5px 5px 0; margin-top: 10px; }
.tab-btn { flex: 1; background: transparent; border: none; color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 500; padding: 10px 0 12px; border-radius: 9px 9px 0 0; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; position: relative; }
.tab-btn.active { background: var(--bg); color: var(--magenta); font-weight: 700; }

.tab-badge {
  position: absolute;
  top: 6px;
  right: 8px;
  background: var(--red);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 20px;
  min-width: 18px;
  text-align: center;
  display: none;
}

.tab-badge.show {
  display: inline-block;
}

/* CONTENT */
.main { flex: 1; overflow-y: auto; padding: 16px; }
.panel { display: none; }
.panel.active { display: block; }

/* CARD & INPUT */
.form-card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; margin-bottom: 14px; }

/* SEARCH BAR */
.search-sticky {
  margin-bottom: 12px;
  position: sticky;
  top: var(--header-h, 0px);
  background: var(--surface);
  z-index: 10;
  padding: 0 0 4px 0;
}

.search-sticky .inp {
  margin-bottom: 0;
}

.search-results {
  max-height: 300px;
  overflow-y: auto;
  margin-bottom: 8px;
}

/* SCAN AREA */
.scan-area { 
  background: var(--magenta); 
  border-radius: 12px; 
  padding: 12px; 
  text-align: center; 
  margin-bottom: 14px; 
  cursor: pointer; 
  transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.2s; 
  box-shadow: 0 2px 12px rgba(192,38,211,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.scan-area:active { transform: scale(0.97); }
.scan-area-icon { font-size: 20px; margin-bottom: 0; }
.scan-area-text { font-weight: 600; font-size: 13px; color: #fff; }
.scan-area-sub { font-size: 10px; color: rgba(255,255,255,0.65); margin-left: 4px; }

.inp { width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 13px; font-size: 13px; margin-bottom: 8px; outline: none; font-family: 'DM Sans', sans-serif; color: var(--text); transition: border-color 0.2s; }
.inp:focus { border-color: var(--magenta-mid); background: #fdf2ff; }
.inp:last-of-type { margin-bottom: 0; }
.btn-primary { background: var(--magenta); color: white; border: none; border-radius: 10px; padding: 13px; width: 100%; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'DM Sans', sans-serif; margin-top: 10px; transition: opacity 0.2s, transform 0.15s; }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.55; }

/* LIST ITEM */
.section-label { font-size: 11px; font-weight: 700; color: var(--text-3); margin-bottom: 10px; letter-spacing: 0.05em; }
.recent-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; margin-bottom: 7px; display: flex; align-items: center; gap: 10px; animation: fadeInUp 0.3s cubic-bezier(0.2, 0.8, 0.4, 1); transition: all 0.2s ease; }
.recent-item:active { transform: scale(0.98); background: var(--magenta-light); }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}

.ri-info { flex: 1; min-width: 0; }
.ri-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ri-meta { font-size: 11px; color: var(--text-2); margin-top: 2px; }

.sku-tag {
  display: inline-block;
  background: var(--magenta-light);
  color: var(--magenta);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  margin-right: 6px;
}

/* PULL CARD */
.pull-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; border-left: 4px solid var(--red); padding: 12px 13px; margin-bottom: 8px; transition: all 0.25s cubic-bezier(0.2, 0.8, 0.4, 1); animation: slideInLeft 0.3s ease; }
.pull-card:active { transform: scale(0.98); }
.pull-card.amber { border-left-color: var(--amber); }
.pull-card.green { border-left-color: var(--green); }
.pull-card.done { opacity: 0.38; }
.pull-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.pull-name { font-size: 13px; font-weight: 600; }
.pull-meta { font-size: 11px; color: var(--text-2); margin-top: 3px; }
.check-box { min-width: 28px; height: 28px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.2s cubic-bezier(0.34, 1.2, 0.64, 1); }
.check-box:active { transform: scale(0.9); }
.check-box.checked { background: var(--green); border-color: var(--green); }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-2); font-size: 13px; }
.empty-icon { font-size: 36px; margin-bottom: 10px; }

/* SCANNER OVERLAY */
.scanner-overlay { position: fixed; inset: 0; background: #000; z-index: 200; display: none; flex-direction: column; }
.scanner-overlay.open { display: flex; }
.scanner-header { padding: 54px 20px 15px; display: flex; justify-content: space-between; align-items: center; }
.scanner-title { color: white; font-weight: 700; font-size: 16px; }
.scanner-close { background: rgba(255,255,255,0.15); border: none; color: white; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.scanner-hint { color: rgba(255,255,255,0.5); font-size: 12px; text-align: center; padding: 0 20px 10px; }
#html5-qrcode-container { flex: 1; }

.scanner-frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 240px; height: 240px; pointer-events: none; z-index: 210; }
.scanner-frame::before, .scanner-frame::after { content: ''; position: absolute; width: 36px; height: 36px; border-color: #fff; border-style: solid; }
.scanner-frame::before { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
.scanner-frame::after { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }
.scanner-frame-tr, .scanner-frame-bl { position: absolute; width: 36px; height: 36px; border-color: #fff; border-style: solid; }
.scanner-frame-tr { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
.scanner-frame-bl { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
@keyframes scanLine { 0% { top: 10%; } 100% { top: 90%; } }
.scan-line { position: absolute; left: 5%; right: 5%; height: 2px; background: linear-gradient(90deg, transparent, #c026d3, #d946ef, #c026d3, transparent); border-radius: 2px; animation: scanLine 1.8s ease-in-out infinite alternate; z-index: 211; }

/* TOAST */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  z-index: 1000;
  max-width: 90%;
  text-align: center;
  transition: all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }

.not-registered {
  border: 2px solid #fca5a5 !important;
  background: #fef2f2 !important;
}

.not-registered-badge {
  display: inline-block;
  margin-top: 6px;
  padding: 4px 8px;
  border-radius: 8px;
  background: #dc2626;
  color: white;
  font-size: 11px;
  font-weight: 700;
}

.offline-badge { background: var(--amber); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-left: 6px; }

.search-item { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 4px; cursor: pointer; transition: all 0.15s; }
.search-item:active { transform: scale(0.98); background: var(--magenta-light); }
.search-item-name { font-size: 13px; font-weight: 600; }
.search-item-barcode { font-size: 11px; color: var(--text-2); margin-top: 2px; }

/* OFFLINE INDICATOR */
.offline-indicator {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #dc2626;
  color: white;
  text-align: center;
  padding: 8px;
  font-size: 12px;
  font-weight: 600;
  transform: translateY(100%);
  transition: transform 0.3s ease;
  z-index: 1000;
}
.offline-indicator.show { transform: translateY(0); }
.online-indicator {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #059669;
  color: white;
  text-align: center;
  padding: 8px;
  font-size: 12px;
  font-weight: 600;
  transform: translateY(100%);
  transition: transform 0.3s ease;
  z-index: 1000;
}
.online-indicator.show { transform: translateY(0); }

/* EXPIRED CARD */
.expired-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  border-left: 4px solid var(--red);
  padding: 12px 13px;
  margin-bottom: 8px;
  transition: all 0.25s cubic-bezier(0.2, 0.8, 0.4, 1);
  animation: slideInLeft 0.3s ease;
}
.expired-card:active { transform: scale(0.98); }
.expired-name { font-size: 13px; font-weight: 600; }
.expired-meta { font-size: 11px; color: var(--text-2); margin-top: 3px; }
.expired-badge {
  background: var(--red);
  color: white;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 9px;
  font-weight: 700;
  margin-left: 8px;
}

.ketentuan-info {
  display: inline-block;
  background: #fef3c7;
  color: #92400e;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 600;
  margin-left: 4px;
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>
<div class="offline-indicator" id="offlineIndicator">📡 Mode Offline - Data disimpan sementara</div>
<div class="online-indicator" id="onlineIndicator">✅ Kembali Online - Sinkronisasi otomatis</div>

<div class="scanner-overlay" id="scannerOverlay">
  <div class="scanner-header">
    <span class="scanner-title">📷 Scan Barcode</span>
    <button class="scanner-close" onclick="closeScanner()">Tutup</button>
  </div>
  <p class="scanner-hint">Arahkan kamera ke barcode produk</p>
  <div style="position:relative; flex:1;">
    <div id="html5-qrcode-container" style="width:100%;height:100%;"></div>
    <div class="scanner-frame">
      <div class="scan-line"></div>
      <div class="scanner-frame-tr"></div>
      <div class="scanner-frame-bl"></div>
    </div>
  </div>
</div>

<div class="header" id="header">
  <div class="header-top">
    <div>
      <div class="header-title">Expired Control D&D</div>
      <div class="header-date" id="headerDate"></div>
    </div>
    
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="sync-btn" onclick="window.location.href='admin.html'">⚙️ Admin Panel</button>
      <button class="sync-btn" onclick="manualSync()" id="syncBtn">↻ Sync</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tabInput" onclick="switchTab('input')">
      Input
      <span class="tab-badge" id="inputBadge"></span>
    </button>
    <button class="tab-btn" id="tabTarik" onclick="switchTab('tarik')">
      Tarik
      <span class="tab-badge" id="tarikBadge"></span>
    </button>
    <button class="tab-btn" id="tabExpToday" onclick="switchTab('expToday')">
      Exp hari ini
      <span class="tab-badge" id="expTodayBadge"></span>
    </button>
  </div>
</div>

<div class="main">
  <div class="panel active" id="panelInput">
    <div class="form-card" id="formCard">
      
      <div class="search-sticky">
        <input class="inp" id="searchProduct" placeholder="🔍 Cari SKU, nama barang, atau barcode" oninput="searchProductList(this.value)">
        <div id="searchResults"></div>
      </div>

      <div class="scan-area" onclick="openScanner()" id="scanArea">
        <span class="scan-area-icon">📷</span>
        <span class="scan-area-text">Scan Barcode</span>
        <span class="scan-area-sub">Klik</span>
      </div>

      <input class="inp" id="fBarcode" placeholder="Barcode (atau scan)" oninput="autoFill(this.value)">
      <div id="productInfo" style="margin-bottom: 8px; font-size: 11px; color: var(--text-2);"></div>
      <input class="inp" id="fSKU" placeholder="SKU (otomatis terisi)" readonly style="background: #f5f3ff;">
      <input class="inp" id="fDesc" placeholder="Nama Barang (otomatis terisi)" readonly style="background: #f5f3ff;">
      <input class="inp" id="fExp" type="date" placeholder="Pilih Tanggal Expired">
      <select class="inp" id="fLokasi">
        <option value="">-- Pilih Lokasi --</option>
        <option value="Selling">Selling</option>
        <option value="Backroom">Backroom</option>
      </select>
      <button class="btn-primary" onclick="submitInput()" id="submitBtn" disabled>💾 Simpan Ke Spreadsheet</button>
    </div>

    <div class="section-label">INPUT HARI INI</div>
    <div id="recentList"></div>
  </div>

  <div class="panel" id="panelTarik">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;">
      <div class="section-label" style="margin:0;">List barang yg harus ditarik</div>
      <div id="pullTotalInfo" style="margin-top:6px; font-size:11px; color:var(--text-2); font-weight:600; white-space:nowrap; min-width:max-content;">Total: 0</div>
      <input type="date" id="pullDateFilter" class="inp" style="width:auto;margin:0;padding:8px 10px;font-size:12px;" onchange="changePullDate(this.value)">
    </div>
    <div id="pullList"></div>
  </div>

  <div class="panel" id="panelExpToday">
    <div class="section-label">📅 BARANG YANG EXPIRED HARI INI</div>
    <div id="expTodayList"></div>
  </div>
</div>

<script src="/common.js"></script>
<script>
const SUBMIT_LABEL = "💾 Simpan Ke Spreadsheet";
const INACTIVITY_DURATION = 30 * 60 * 1000;
const MAX_SEARCH_RESULTS = 50;
const KEY_DB = 'cache_db_magenta_v3';
const KEY_IN = 'cache_in_magenta_v3';
const KEY_QUEUE = 'offline_queue_magenta_v3';
const KEY_CHECKED = 'cache_checked_magenta_v4';

let dbItems = [];            // master database (sudah dinormalisasi)
let productMap = new Map();  // barcodeKey -> produk
let serverInputs = [];       // data input dari spreadsheet
let offlineQueue = [];       // input yang belum terkirim: { body, queuedAt }
let checkedRows = new Set(); // kunci item yang sudah dicentang di tab Tarik
let selectedPullDate = getTodayStr();
let selectedProduct = null;
let lastFoundKey = null;
let searchResultsCache = [];
let html5QrScanner = null;
let scannerHandled = false;
let isOnline = navigator.onLine;
let isSyncingQueue = false;
let isSubmitting = false;
let toastTimer = null;
let inactivityTimer = null;

const $ = (id) => document.getElementById(id);

// ========== DATA ==========
function setDatabase(items) {
  dbItems = items.map(normalizeDbItem);
  productMap = new Map();
  dbItems.forEach(item => {
    const key = barcodeKey(item.barcode);
    if (key && !productMap.has(key)) productMap.set(key, item);
  });
}

function getProduct(barcode) {
  const key = barcodeKey(barcode);
  return key ? (productMap.get(key) || null) : null;
}

// Input dari server + input offline yang belum terkirim
function getAllInputs() {
  const pending = offlineQueue.map(q => normalizeInputItem({
    ...q.body,
    timestamp: getTodayStr(new Date(q.queuedAt || q.timestamp || Date.now())),
    offline: true
  }));
  return serverInputs.concat(pending);
}

function inputKey(i) {
  return `${barcodeKey(i.barcode)}|${i.expISO || ''}|${(i.lokasi || '').toLowerCase()}|${(i.timestamp || '').slice(0, 10)}`;
}

// ========== CACHE ==========
function readJSON(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch (e) { return fallback; }
}

function writeJSON(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); }
  catch (e) { console.error('Gagal simpan cache:', e); }
}

function loadCache() {
  // Cache dipakai berapapun umurnya; akan diperbarui oleh loadAll() saat online.
  setDatabase(readJSON(KEY_DB, []));
  serverInputs = readJSON(KEY_IN, []).map(normalizeInputItem);
  offlineQueue = readJSON(KEY_QUEUE, []);
  checkedRows = new Set(readJSON(KEY_CHECKED, []));
}

function saveCheckedRows() { writeJSON(KEY_CHECKED, [...checkedRows]); }
function saveOfflineQueue() { writeJSON(KEY_QUEUE, offlineQueue); }

// ========== OFFLINE QUEUE ==========
function isNetworkError(e) { return !(e instanceof ApiError); }

function queueOffline(body) {
  offlineQueue.push({ body, queuedAt: Date.now() });
  saveOfflineQueue();
}

async function syncOfflineQueue() {
  if (isSyncingQueue || !isOnline || offlineQueue.length === 0) return false;
  isSyncingQueue = true;
  showToast(`🔄 Sinkronisasi ${offlineQueue.length} data offline...`, "info");
  let sent = 0, rejected = 0, networkFailed = false;
  try {
    while (offlineQueue.length > 0) {
      const item = offlineQueue[0];
      try {
        await callApi("addInput", item.body);
        sent++;
      } catch (e) {
        if (isNetworkError(e)) { networkFailed = true; break; }
        // Ditolak server (data tidak valid): buang supaya antrian tidak macet
        console.error('Data offline ditolak server:', item.body, e);
        rejected++;
      }
      offlineQueue.shift();
      saveOfflineQueue();
    }
  } finally {
    isSyncingQueue = false;
  }
  if (networkFailed) showToast(`⚠️ Koneksi terputus, ${offlineQueue.length} data masih menunggu`, "warning");
  else if (rejected) showToast(`⚠️ ${sent} terkirim, ${rejected} ditolak server`, "error");
  else showToast(`✅ ${sent} data offline berhasil disinkronkan`, "success");
  return sent > 0;
}

function initOfflineDetection() {
  window.addEventListener('online', async () => {
    isOnline = true;
    const indicator = $('onlineIndicator');
    indicator.classList.add('show');
    setTimeout(() => indicator.classList.remove('show'), 3000);
    await syncOfflineQueue();
    await loadAll();
  });
  window.addEventListener('offline', () => {
    isOnline = false;
    const indicator = $('offlineIndicator');
    indicator.classList.add('show');
    setTimeout(() => indicator.classList.remove('show'), 3000);
    showToast("📡 Mode Offline - Data akan disimpan sementara", "warning");
  });
}

// ========== LOAD ==========
async function loadAll({ silent = false } = {}) {
  if (!isOnline) {
    if (!silent) showToast("📡 Mode Offline - Menampilkan data dari cache", "warning");
    renderAll();
    return;
  }
  const syncBtn = $('syncBtn');
  syncBtn.innerText = "Sync..."; syncBtn.disabled = true;
  try {
    const [dbRes, inRes] = await Promise.all([callApi("getDatabase"), callApi("getInputs")]);
    setDatabase(dbRes.data || []);
    serverInputs = (inRes.data || []).map(normalizeInputItem);
    writeJSON(KEY_DB, dbItems);
    writeJSON(KEY_IN, serverInputs);
    pruneCheckedRows();
    renderAll();
    if (!silent) showToast("✅ Data berhasil disinkronkan", "success");
  } catch (e) {
    console.error("Load error:", e);
    renderAll();
    showToast("❌ Gagal sync: " + e.message, "error");
  } finally {
    syncBtn.innerText = "↻ Sync"; syncBtn.disabled = false;
  }
}

async function manualSync() {
  await syncOfflineQueue();
  await loadAll();
}

// Buang centang untuk item yang sudah tidak ada di spreadsheet
function pruneCheckedRows() {
  const valid = new Set(serverInputs.map(inputKey));
  let changed = false;
  checkedRows.forEach(k => { if (!valid.has(k)) { checkedRows.delete(k); changed = true; } });
  if (changed) saveCheckedRows();
}

// ========== PERHITUNGAN ==========
function getPullInfo(i, today) {
  if (!i.expISO) return null;
  const hMin = getProduct(i.barcode)?.hMinus || 0;
  const daysUntilExp = daysBetween(i.expISO, today) + 1;
  const daysUntilPull = daysUntilExp - (hMin - 1);
  const status = (daysUntilPull <= 0) ? 'red' : (daysUntilPull <= 3) ? 'amber' : 'green';
  const pullDate = addDays(i.expISO, -(hMin - 1));
  return { daysUntilExp, status, pullDate };
}

function computeLists(inputs) {
  const today = getTodayStr();
  const filterDate = selectedPullDate || today;
  const recent = inputs.filter(i => i.timestamp.startsWith(today)).reverse();
  const expToday = inputs.filter(i => i.expISO === today);
  const pull = inputs
    .map(i => ({ ...i, pullInfo: getPullInfo(i, today) }))
    .filter(i => i.pullInfo && i.pullInfo.pullDate === filterDate)
    .sort((a, b) => a.pullInfo.daysUntilExp - b.pullInfo.daysUntilExp);
  return { recent, expToday, pull };
}

// ========== RENDER ==========
function renderAll() {
  const { recent, expToday, pull } = computeLists(getAllInputs());
  renderRecent(recent);
  renderPullList(pull);
  renderExpTodayList(expToday);
  setBadge('inputBadge', recent.length);
  setBadge('tarikBadge', pull.length);
  setBadge('expTodayBadge', expToday.length);
}

function setBadge(id, count) {
  const el = $(id);
  el.innerText = count > 99 ? '99+' : count;
  el.classList.toggle('show', count > 0);
}

function itemTags(i, { ketentuan = true } = {}) {
  const product = getProduct(i.barcode);
  const skuTag = product?.sku ? `<span class="sku-tag">SKU: ${escHtml(product.sku)}</span>` : '';
  const ket = ketentuan && product?.hMinus ? `<span class="ketentuan-info">${getKetentuanTarik(product.hMinus)}</span>` : '';
  const offline = i.offline ? '<span class="offline-badge">📡 Offline</span>' : '';
  return { product, skuTag, ket, offline };
}

const NOT_REGISTERED_BADGE = `<div class="not-registered-badge">⚠️ Belum Terdaftar di Database Master</div>`;

function renderRecent(list) {
  const container = $('recentList');
  if (!list.length) { container.innerHTML = `<div class="empty-state">Belum ada input hari ini</div>`; return; }
  container.innerHTML = list.map(i => {
    const { product, skuTag, ket, offline } = itemTags(i);
    return `<div class="recent-item ${product ? '' : 'not-registered'}">
      <div class="ri-info">
        <div class="ri-name">${skuTag}${escHtml(i.description || i.barcode)}${ket}${offline}</div>
        <div class="ri-meta">${escHtml(i.barcode)} · Exp: ${formatDateIndo(i.expISO)} · Lokasi: ${escHtml(i.lokasi || '-')}</div>
        ${product ? '' : NOT_REGISTERED_BADGE}
      </div>
    </div>`;
  }).join('');
}

function renderPullList(list) {
  const container = $('pullList');
  $('pullTotalInfo').innerText = `Total: ${list.length}`;
  if (!list.length) { container.innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div>Tidak ada barang yg wajib ditarik di tanggal ini</div>`; return; }
  container.innerHTML = list.map(i => {
    const { product, skuTag, ket, offline } = itemTags(i);
    const key = inputKey(i);
    const checked = checkedRows.has(key);
    return `<div class="pull-card ${i.pullInfo.status} ${checked ? 'done' : ''} ${product ? '' : 'not-registered'}">
      <div class="pull-card-top">
        <div style="flex:1">
          <div class="pull-name">${skuTag}${escHtml(i.description || i.barcode)}${ket}${offline}</div>
          <div class="pull-meta">Exp: ${formatDateIndo(i.expISO)} (${i.pullInfo.daysUntilExp} hari menuju expired) · Lokasi: ${escHtml(i.lokasi || '-')}</div>
          ${product ? '' : NOT_REGISTERED_BADGE}
        </div>
        <div class="check-box ${checked ? 'checked' : ''}" data-key="${escHtml(key)}">${checked ? '✔️' : ''}</div>
      </div>
    </div>`;
  }).join('');
}

function renderExpTodayList(list) {
  const container = $('expTodayList');
  if (!list.length) { container.innerHTML = `<div class="empty-state"><div class="empty-icon">🎉</div>Tidak ada barang yang expired hari ini</div>`; return; }
  container.innerHTML = list.map(i => {
    const { product, skuTag, offline } = itemTags(i, { ketentuan: false });
    return `<div class="expired-card ${product ? '' : 'not-registered'}">
      <div class="pull-card-top">
        <div style="flex:1">
          <div class="expired-name">
            ${skuTag}${escHtml(i.description || i.barcode)}${offline}
            <span class="expired-badge">EXPIRED HARI INI</span>
          </div>
          <div class="expired-meta">${escHtml(i.barcode)} · Exp: ${formatDateIndo(i.expISO)} · Lokasi: ${escHtml(i.lokasi || '-')}</div>
          ${product ? '' : NOT_REGISTERED_BADGE}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCheck(key) {
  if (checkedRows.has(key)) checkedRows.delete(key); else checkedRows.add(key);
  saveCheckedRows();
  renderAll();
}

// ========== FORM INPUT ==========
function setSelectedProduct(product) {
  selectedProduct = product;
  $('fSKU').value = product?.sku || '';
  $('fDesc').value = product?.description || '';
  if (product) {
    const ket = getKetentuanTarik(product.hMinus);
    $('productInfo').innerHTML = `<span class="sku-tag">SKU: ${escHtml(product.sku || '-')}</span>${ket ? `<span class="ketentuan-info">Ketentuan Tarik: ${ket}</span>` : ''}`;
  }
  $('submitBtn').disabled = !product;
}

function resetForm() {
  ['fBarcode', 'fSKU', 'fDesc', 'fExp', 'fLokasi', 'searchProduct'].forEach(id => $(id).value = '');
  $('searchResults').innerHTML = '';
  $('productInfo').innerHTML = '';
  selectedProduct = null;
  lastFoundKey = null;
  $('submitBtn').disabled = true;
}

function autoFill(val) {
  const key = barcodeKey(val);
  if (!key) {
    setSelectedProduct(null);
    $('productInfo').innerHTML = '';
    lastFoundKey = null;
    return;
  }
  const found = productMap.get(key) || null;
  setSelectedProduct(found);
  if (found) {
    if (lastFoundKey !== key) showToast("✓ Produk ditemukan: " + (found.description || found.barcode), "success");
    lastFoundKey = key;
  } else {
    lastFoundKey = null;
    $('productInfo').innerHTML = '<span style="color: var(--red);">⚠️ Barcode tidak terdaftar di database</span>';
  }
}

function searchProductList(keyword) {
  const container = $('searchResults');
  const search = keyword.trim().toLowerCase();
  if (!search) { container.innerHTML = ''; searchResultsCache = []; return; }

  const results = dbItems.filter(item =>
    item.description.toLowerCase().includes(search) ||
    item.barcode.includes(search) ||
    item.sku.toLowerCase().includes(search)
  );
  searchResultsCache = results.slice(0, MAX_SEARCH_RESULTS);
  container.className = "search-results";
  if (!results.length) {
    container.innerHTML = `<div class="search-item" style="text-align:center; color:var(--text-2);">Tidak ditemukan</div>`;
    return;
  }
  const more = results.length > MAX_SEARCH_RESULTS
    ? `<div class="search-item" style="text-align:center; color:var(--text-2);">+${results.length - MAX_SEARCH_RESULTS} lainnya, perjelas kata kunci</div>` : '';
  container.innerHTML = searchResultsCache.map((item, idx) => {
    const ket = getKetentuanTarik(item.hMinus);
    return `<div class="search-item" data-idx="${idx}">
      <div class="search-item-name">
        <span class="sku-tag">SKU: ${escHtml(item.sku || '-')}</span>
        ${escHtml(item.description)}
        ${ket ? `<span class="ketentuan-info">${ket}</span>` : ''}
      </div>
      <div class="search-item-barcode">Barcode: ${escHtml(item.barcode)}</div>
    </div>`;
  }).join('') + more;
}

function selectProduct(item) {
  $('fBarcode').value = item.barcode;
  $('searchProduct').value = item.description || '';
  $('searchResults').innerHTML = '';
  searchResultsCache = [];
  lastFoundKey = barcodeKey(item.barcode);
  setSelectedProduct(item);
}

async function submitInput() {
  if (isSubmitting) return;
  const product = getProduct($('fBarcode').value);
  const e = $('fExp').value;
  const l = $('fLokasi').value.trim();

  if (!product) return showToast("⚠️ Barcode tidak ditemukan. Hubungi Admin.", "error");
  if (!e || !l) return showToast("Semua field wajib diisi!", "error");

  const today = getTodayStr();
  const duplicate = getAllInputs().find(item =>
    item.timestamp.startsWith(today) &&
    barcodeKey(item.barcode) === barcodeKey(product.barcode) &&
    item.expISO === e &&
    item.lokasi.toLowerCase() === l.toLowerCase());
  if (duplicate && !confirm("⚠️ Data serupa sudah pernah diinput hari ini.\n\n" + product.description + "\nExp: " + formatDateIndo(e) + "\nLokasi: " + l + "\n\nLanjut simpan?")) return;

  const payload = { barcode: product.barcode, sku: product.sku, description: product.description, expiredDate: e, lokasi: l };
  const btn = $('submitBtn');
  isSubmitting = true;
  btn.disabled = true; btn.innerText = "Menyimpan...";
  try {
    if (!isOnline) {
      queueOffline(payload);
      showToast("📡 Disimpan offline - Akan sync otomatis", "warning");
    } else {
      try {
        const res = await callApi("addInput", payload);
        serverInputs.push(normalizeInputItem({ ...payload, rowIndex: res.rowIndex, timestamp: today }));
        writeJSON(KEY_IN, serverInputs);
        showToast("✅ Berhasil disimpan", "success");
      } catch (err) {
        if (!isNetworkError(err)) throw err;
        // Koneksi bermasalah walau status online: simpan ke antrian
        queueOffline(payload);
        showToast("📡 Koneksi gagal - Disimpan offline", "warning");
      }
    }
    resetForm();
    renderAll();
  } catch (x) {
    showToast("❌ Gagal simpan: " + x.message, "error");
  } finally {
    isSubmitting = false;
    btn.innerText = SUBMIT_LABEL;
    btn.disabled = !selectedProduct;
  }
}

// ========== SCANNER ==========
function getScanFormats() {
  if (typeof Html5QrcodeSupportedFormats === 'undefined') return undefined;
  const F = Html5QrcodeSupportedFormats;
  return [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF];
}

async function openScanner() {
  if (typeof Html5Qrcode === 'undefined') return showToast("❌ Library scanner gagal dimuat", "error");
  if (html5QrScanner) return;
  $('scannerOverlay').classList.add('open');
  scannerHandled = false;
  html5QrScanner = new Html5Qrcode("html5-qrcode-container", { formatsToSupport: getScanFormats(), verbose: false });
  try {
    await html5QrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 240 }, (text) => {
      if (scannerHandled) return;
      scannerHandled = true;
      closeScanner();
      $('fBarcode').value = text;
      autoFill(text);
      showToast("📷 Barcode terbaca", "success");
    });
  } catch (e) {
    console.error("Scanner error:", e);
    showToast("❌ Kamera tidak bisa dibuka. Periksa izin kamera.", "error");
    await closeScanner();
  }
}

async function closeScanner() {
  $('scannerOverlay').classList.remove('open');
  const scanner = html5QrScanner;
  html5QrScanner = null;
  if (!scanner) return;
  try { if (scanner.isScanning) await scanner.stop(); } catch (e) { console.error(e); }
  try { scanner.clear(); } catch (e) { /* abaikan */ }
}

// ========== UI ==========
function switchTab(t) {
  const name = t.charAt(0).toUpperCase() + t.slice(1);
  document.querySelectorAll('.panel, .tab-btn').forEach(el => el.classList.remove('active'));
  $('panel' + name)?.classList.add('active');
  $('tab' + name)?.classList.add('active');
}

function changePullDate(val) { selectedPullDate = val || getTodayStr(); renderAll(); }

function showToast(msg, type = '') {
  const t = $('toast');
  if (toastTimer) clearTimeout(toastTimer);
  t.innerText = msg;
  t.style.background = { success: '#065f46', error: '#7f1d1d', warning: '#d97706' }[type] || '#1c1033';
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  toastTimer = setTimeout(() => { t.classList.remove('show'); toastTimer = null; }, 3000);
}

function updateHeaderHeight() {
  document.documentElement.style.setProperty('--header-h', $('header').offsetHeight + 'px');
}

// ========== SESSION TIMEOUT ==========
function resetInactivityTimer() {
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    const activeTab = document.querySelector('.panel.active')?.id;
    const hasFormData = $('fBarcode').value.trim() !== '' || $('fDesc').value.trim() !== '';
    if (activeTab === 'panelInput' && hasFormData) {
      resetForm();
      showToast("⏰ Form direset karena tidak ada aktivitas selama 30 menit", "warning");
    } else if (activeTab !== 'panelInput') {
      switchTab('input');
      showToast("⏰ Kembali ke tab Input karena tidak ada aktivitas", "warning");
    }
  }, INACTIVITY_DURATION);
}

['click', 'keydown', 'touchstart', 'input'].forEach(evt => {
  document.addEventListener(evt, resetInactivityTimer, { passive: true });
});

// ========== EVENT DELEGATION ==========
$('pullList').addEventListener('click', (e) => {
  const box = e.target.closest('.check-box');
  if (box) toggleCheck(box.dataset.key);
});

$('searchResults').addEventListener('click', (e) => {
  const el = e.target.closest('.search-item[data-idx]');
  if (el) selectProduct(searchResultsCache[Number(el.dataset.idx)]);
});

// ========== SERVICE WORKER ==========
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW gagal:', err));
}

// ========== INIT ==========
window.addEventListener('load', async () => {
  $('headerDate').innerText = formatDateIndo(getTodayStr());
  selectedPullDate = getTodayStr();
  $('pullDateFilter').value = selectedPullDate;
  updateHeaderHeight();
  window.addEventListener('resize', updateHeaderHeight);
  loadCache();
  renderAll();
  initOfflineDetection();
  resetInactivityTimer();
  if (isOnline && offlineQueue.length) await syncOfflineQueue();
  await loadAll({ silent: true });
});
</script>
